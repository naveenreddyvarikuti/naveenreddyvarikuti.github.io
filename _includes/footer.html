<link id="fa-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/all.min.css">

<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper footer-grid">

    <div class="footer-col author-col">
      {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.name -%}
            <li class="p-name">{{ site.author.name | escape }}</li>
          {% endif -%}
          {% if site.author.email -%}
            <li class="email"><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          {%- endif %}
        </ul>
      {%- endif %}
    </div>

    <div class="footer-col bio-col">
      <p>{{ site.description | escape }}</p>
    </div>

    <div class="footer-col links-col">
      <div class="social-links">
        {%- include social.html -%}
      </div>
    </div>

  </div>

</footer>
